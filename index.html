
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookie Clicker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Georgia,serif;
  color:#4a2818;
  background:
    radial-gradient(ellipse at top,#fff9e9 0%,#d8e9d9 45%,#8cb69a 100%);
}
button{font-family:inherit;cursor:pointer}
#game{height:100dvh;display:flex;flex-direction:column}
header{
  height:66px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;gap:12px;
  color:#fff5d8;
  background:linear-gradient(90deg,#791b27,#b52b37,#791b27);
  border-bottom:4px solid #e3bd55;
  box-shadow:0 3px 12px #3e1b1b88;
  font-size:27px;font-weight:bold;letter-spacing:1px;
  text-shadow:2px 2px #481014;
}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 350px}
#bakery{
  min-width:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px;
  background:
    radial-gradient(circle at center,#fff4d7aa,#d9e7c5aa),
    repeating-linear-gradient(45deg,#ffffff0a 0 10px,#477b3d0a 10px 20px);
}
#stats{text-align:center;margin-bottom:8px;z-index:2}
#cookieCount{font-size:clamp(27px,4vw,43px);font-weight:bold;color:#713b1e;text-shadow:1px 2px #fff3d1}
#cps{font-size:17px;color:#426b3d;margin-top:4px}
#clickPower{font-size:13px;color:#90643d;margin-top:3px}
#cookieStage{
  width:min(66vw,58vh,540px);
  height:min(66vw,58vh,540px);
  min-width:250px;min-height:250px;
  position:relative;display:flex;align-items:center;justify-content:center;
  isolation:isolate;
}
#cookie{
  width:47%;height:47%;border-radius:50%;
  border:8px solid #8d4c22;
  background:radial-gradient(circle at 30% 25%,#d99a4d,#a85b24 65%,#713718);
  box-shadow:inset -12px -14px 18px #57270d66,inset 8px 8px 14px #ffcf7a88,0 12px 24px #512b1d66;
  position:relative;z-index:3;transition:transform .08s;user-select:none;
}
.chip{position:absolute;width:9%;height:12%;border-radius:45%;background:#48200e;box-shadow:inset 2px 2px 2px #a66b3a}
.chip:nth-child(1){top:18%;left:27%;transform:rotate(25deg)}
.chip:nth-child(2){top:25%;left:65%;transform:rotate(-25deg)}
.chip:nth-child(3){top:52%;left:18%;transform:rotate(15deg)}
.chip:nth-child(4){top:66%;left:57%;transform:rotate(35deg)}
.chip:nth-child(5){top:43%;left:46%;transform:rotate(-15deg)}
.chip:nth-child(6){top:75%;left:35%;transform:rotate(20deg)}
.chip:nth-child(7){top:13%;left:48%;transform:rotate(-10deg)}
.chip:nth-child(8){top:48%;left:76%;transform:rotate(30deg)}

/* Animated cursors */
.cursorSprite{
  position:absolute;z-index:4;
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;font-size:27px;line-height:1;
  color:#fff0c5;
  text-shadow:1px 2px 2px #48230f,0 0 5px #fff0c4;
  pointer-events:none;
  transform-origin:center;
}
#cursorCount{
  position:absolute;bottom:1%;right:1%;z-index:5;
  background:#17633b;color:white;border:2px solid #e5c17a;
  border-radius:20px;padding:4px 9px;font-size:12px;display:none;
}
#clickHint{font-size:14px;color:#4b7443;margin-top:10px}
#goldenCookie{
  display:none;position:absolute;z-index:8;font-size:42px;
  border:0;background:none;filter:drop-shadow(0 0 10px gold);
  animation:goldPulse .8s infinite alternate;
}
@keyframes goldPulse{to{transform:scale(1.25)}}

#shop{
  min-height:0;overflow-y:auto;
  background:linear-gradient(180deg,#f3e8c9,#e5c995);
  border-left:5px solid #d5ad50;padding:12px;
  scrollbar-color:#9d6635 #e7c99a;
}
.shopHeader{
  text-align:center;font-size:23px;font-weight:bold;padding:9px;
  color:#fff5d8;
  background:linear-gradient(90deg,#17613a,#23804b,#17613a);
  border:2px solid #d7b65c;border-radius:9px;
  text-shadow:1px 2px #123c27;margin-bottom:10px;
}
.sectionTitle{
  margin:18px 0 8px;padding:9px 10px;border-radius:7px;
  font-size:17px;font-weight:bold;color:#fff4dc;
  background:linear-gradient(90deg,#17613a,#27804b);
  border:1px solid #d5b65e;
  box-shadow:0 2px 4px #6b3c2044;
}
.sectionTitle.christmas{
  background:linear-gradient(90deg,#9e1d2b,#d13b42,#17633b);
  border:2px solid #e2bb57;
  text-shadow:1px 1px #4b1119;
}
.upgrade{
  display:flex;align-items:center;gap:10px;min-height:68px;
  margin-bottom:7px;padding:8px;
  border:2px solid #b8864c;border-radius:9px;
  background:linear-gradient(110deg,#fff1d5,#ecd0a1);
  box-shadow:0 2px 4px #6e421c33;transition:.12s;
}
.upgrade:hover{transform:translateX(-3px);filter:brightness(1.04)}
.upgrade:disabled{opacity:.48;filter:grayscale(.4);cursor:not-allowed}
.upgradeIcon{
  width:43px;height:43px;flex-shrink:0;display:grid;place-items:center;
  border-radius:8px;background:#d8b17b;font-size:25px;
}
.upgradeInfo{flex:1;min-width:0}
.upgradeName{font-weight:bold;font-size:15px}
.upgradeDesc{font-size:11px;color:#805b38;margin-top:3px}
.upgradeCost{font-size:12px;color:#36743a;font-weight:bold;margin-top:4px}
.upgradeCount{font-size:17px;font-weight:bold;color:#79421e;min-width:20px;text-align:center}
.christmasUpgrade{
  border:2px solid #b82c3a;
  background:linear-gradient(110deg,#fff0df,#d8e9ce);
}
.christmasUpgrade .upgradeIcon{
  background:linear-gradient(135deg,#c93b42 0%,#c93b42 48%,#26824b 52%,#26824b 100%);
  border:1px solid #e0b84f;
}
#bottomBar{
  flex-shrink:0;min-height:43px;
  background:linear-gradient(90deg,#791b27,#17613a,#791b27);
  color:#f8e5bf;display:flex;justify-content:center;align-items:center;
  gap:10px;padding:5px;font-family:Arial,sans-serif;font-size:12px;
  border-top:3px solid #d7ad50;
}
.smallButton{
  border:1px solid #e0bd64;
  background:#a52c36;color:white;padding:6px 11px;border-radius:5px;
}
.smallButton:hover{background:#c13c43}
.snowflake{
  position:fixed;top:-15px;z-index:10;pointer-events:none;color:white;
  text-shadow:0 0 5px #fff;animation:fall linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#toast{
  position:fixed;bottom:65px;left:50%;transform:translateX(-50%);
  background:#17613a;color:#fff3d8;border:2px solid #d5ad66;
  border-radius:9px;padding:10px 17px;z-index:20;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
@media(max-width:700px){
  #main{grid-template-columns:1fr 270px}
  #cookieStage{width:min(55vw,45vh);height:min(55vw,45vh)}
  header{height:52px;font-size:22px}
}
@media(max-width:520px){
  #main{grid-template-columns:1fr 190px}
  #shop{padding:7px}
  .upgrade{gap:5px;padding:5px}
  .upgradeIcon{width:32px;height:32px;font-size:19px}
  .upgradeName{font-size:12px}
  .upgradeDesc{font-size:10px}
  .upgradeCost{font-size:10px}
  #cookieStage{min-width:190px;min-height:190px}
}
</style>
</head>
<body>
<div id="game">
<header>🎄 COOKIE CLICKER 🎄</header>
<div id="main">
<section id="bakery">
  <div id="stats">
    <div id="cookieCount">0 cookies</div>
    <div id="cps">per second: 0</div>
    <div id="clickPower">per click: 1</div>
  </div>
  <div id="cookieStage">
    <div id="cookie">
      <span class="chip"></span><span class="chip"></span>
      <span class="chip"></span><span class="chip"></span>
      <span class="chip"></span><span class="chip"></span>
      <span class="chip"></span><span class="chip"></span>
    </div>
    <div id="cursorCount"></div>
    <button id="goldenCookie" title="Click for a bonus!">🎁</button>
  </div>
  <div id="clickHint">❄ Click the cookie to bake cookies! ❄</div>
</section>
<aside id="shop">
  <div class="shopHeader">🎁 CHRISTMAS BAKERY 🎁</div>
  <div class="sectionTitle">🍪 Regular Upgrades</div>
  <div id="normalShop"></div>
  <div class="sectionTitle christmas">🎄 CHRISTMAS LIMITED 🎅</div>
  <div id="christmasShop"></div>
</aside>
</div>
<footer id="bottomBar">
  <span>🎄 Cookie Bakery</span>
  <button class="smallButton" id="soundBtn">🔊 Sound: Off</button>
  <button class="smallButton" id="saveBtn">💾 Save</button>
  <button class="smallButton" id="resetBtn">↻ Reset</button>
</footer>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let cookies=0,totalCookies=0,clickPower=1,sound=false;
let goldenTimeout=null;
const counts={};

const upgrades=[
{id:"cursor",name:"Cursor",icon:"🖱️",desc:"Automatic cookie production.",price:15,cps:.1},
{id:"grandma",name:"Grandma",icon:"👵",desc:"A nice grandma to bake cookies.",price:100,cps:1},
{id:"farm",name:"Farm",icon:"🌾",desc:"Grows cookie plants.",price:1100,cps:8},
{id:"mine",name:"Mine",icon:"⛏️",desc:"Mines cookie dough.",price:12000,cps:47},
{id:"factory",name:"Factory",icon:"🏭",desc:"Mass-produces cookies.",price:130000,cps:260},
{id:"bank",name:"Bank",icon:"🏦",desc:"Generates cookies from interest.",price:1400000,cps:1400},
{id:"temple",name:"Temple",icon:"🏛️",desc:"Ancient cookie powers.",price:20000000,cps:7800},
{id:"wizard",name:"Wizard Tower",icon:"🧙",desc:"Magically creates cookies.",price:330000000,cps:44000},
{id:"shipment",name:"Shipment",icon:"🚀",desc:"Imports cookies from space.",price:5100000000,cps:260000},
{id:"alchemy",name:"Alchemy Lab",icon:"⚗️",desc:"Turns gold into cookies.",price:75000000000,cps:1600000},
{id:"portal",name:"Portal",icon:"🌀",desc:"Opens a cookie dimension.",price:1000000000000,cps:10000000},
{id:"time",name:"Time Machine",icon:"⏰",desc:"Brings cookies from the future.",price:14000000000000,cps:65000000},
{id:"antimatter",name:"Antimatter Condenser",icon:"⚛️",desc:"Condenses the universe into cookies.",price:170000000000000,cps:430000000},
{id:"prism",name:"Prism",icon:"💎",desc:"Converts light into cookies.",price:2100000000000000,cps:2900000000},
{id:"chance",name:"Chance Maker",icon:"🎲",desc:"Creates cookies through luck.",price:26000000000000000,cps:21000000000},
{id:"fractal",name:"Fractal Engine",icon:"🔷",desc:"Cookies create more cookies.",price:310000000000000000,cps:150000000000}
];
const christmasUpgrades=[
{id:"tree",name:"Christmas Tree",icon:"🎄",desc:"A festive cookie tree.",price:500,cps:5},
{id:"snowman",name:"Snowman",icon:"☃️",desc:"A chilly cookie helper.",price:5000,cps:35},
{id:"santa",name:"Santa's Workshop",icon:"🎅",desc:"Santa makes cookies all year.",price:100000,cps:550},
{id:"reindeer",name:"Reindeer Stable",icon:"🦌",desc:"Reindeer-powered cookie production.",price:2500000,cps:12000},
{id:"gift",name:"Gift Factory",icon:"🎁",desc:"Endless presents full of cookies.",price:50000000,cps:300000},
{id:"elf",name:"Elf Helpers",icon:"🧝",desc:"A team of cookie-making elves.",price:900000000,cps:5000000},
{id:"northpole",name:"North Pole Bakery",icon:"❄️",desc:"The ultimate Christmas bakery.",price:25000000000,cps:180000000}
];
[...upgrades,...christmasUpgrades].forEach(u=>counts[u.id]=0);

function format(n){
 if(n<1000)return Math.floor(n).toLocaleString();
 const units=["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
 let i=-1;while(n>=1000&&i<units.length-1){n/=1000;i++}
 return n.toFixed(2)+units[i];
}
function getCps(){
 return [...upgrades,...christmasUpgrades].reduce((s,u)=>s+counts[u.id]*u.cps,0);
}
function showToast(msg){
 const t=$("toast");t.textContent=msg;t.style.opacity=1;
 clearTimeout(showToast.timer);
 showToast.timer=setTimeout(()=>t.style.opacity=0,1800);
}
function renderShop(list,container,isChristmas=false){
 container.innerHTML="";
 list.forEach(u=>{
  const count=counts[u.id]||0;
  const cost=Math.floor(u.price*Math.pow(1.15,count));
  const b=document.createElement("button");
  b.className="upgrade"+(isChristmas?" christmasUpgrade":"");
  b.disabled=cookies<cost;
  b.innerHTML=`
   <div class="upgradeIcon">${u.icon}</div>
   <div class="upgradeInfo">
    <div class="upgradeName">${u.name}</div>
    <div class="upgradeDesc">${u.desc}</div>
    <div class="upgradeCost">🍪 ${format(cost)} cookies</div>
   </div>
   <div class="upgradeCount">${count}</div>`;
  b.addEventListener("click",()=>buyUpgrade(u));
  container.appendChild(b);
 });
}
function render(){
 $("cookieCount").textContent=format(cookies)+" cookies";
 $("cps").textContent="per second: "+format(getCps());
 $("clickPower").textContent="per click: "+format(clickPower);
 renderShop(upgrades,$("normalShop"));
 renderShop(christmasUpgrades,$("christmasShop"));
}
function buyUpgrade(u){
 const cost=Math.floor(u.price*Math.pow(1.15,counts[u.id]));
 if(cookies<cost)return;
 cookies-=cost;counts[u.id]++;
 showToast("Purchased "+u.name+"!");
 render();saveGame();
}
$("cookie").addEventListener("click",()=>{
 cookies+=clickPower;totalCookies+=clickPower;
 $("cookie").style.transform="scale(.94)";
 setTimeout(()=>$("cookie").style.transform="",80);
 render();
});

/* Orbit animation: cursors move around a circular path.
   Each arrow rotates to point from its position toward the cookie. */
function animateCursors(){
 const stage=$("cookieStage");
 stage.querySelectorAll(".cursorSprite").forEach(el=>el.remove());
 const amount=counts.cursor||0;
 const shown=Math.min(amount,60);
 const rect=stage.getBoundingClientRect();
 const cx=rect.width/2,cy=rect.height/2;
 const radius=Math.min(rect.width,rect.height)*.43;
 const time=performance.now()/1000;
 for(let i=0;i<shown;i++){
  const angle=(Math.PI*2*i/shown)+time*.65;
  const x=cx+Math.cos(angle)*radius;
  const y=cy+Math.sin(angle)*radius;
  const cursor=document.createElement("div");
  cursor.className="cursorSprite";
  cursor.textContent="➤";
  cursor.style.left=x+"px";
  cursor.style.top=y+"px";
  // Arrow's default tip points right. Rotate it toward the cookie center.
  const towardCenter=Math.atan2(cy-y,cx-x)*180/Math.PI;
  cursor.style.transform=`translate(-50%,-50%) rotate(${towardCenter}deg)`;
  stage.appendChild(cursor);
 }
 const badge=$("cursorCount");
 if(amount>60){badge.style.display="block";badge.textContent="+"+(amount-60)+" more cursors"}
 else badge.style.display="none";
 requestAnimationFrame(animateCursors);
}
requestAnimationFrame(animateCursors);
window.addEventListener("resize",()=>{});

function spawnGolden(){
 const btn=$("goldenCookie");
 btn.style.display="block";
 btn.style.left=(10+Math.random()*70)+"%";
 btn.style.top=(10+Math.random()*70)+"%";
 goldenTimeout=setTimeout(()=>btn.style.display="none",10000);
}
$("goldenCookie").addEventListener("click",()=>{
 const reward=Math.max(50,getCps()*60,clickPower*50);
 cookies+=reward;totalCookies+=reward;
 $("goldenCookie").style.display="none";
 clearTimeout(goldenTimeout);
 showToast("🎁 Bonus! +"+format(reward)+" cookies!");
 render();saveGame();
});
function snow(){
 const f=document.createElement("div");
 f.className="snowflake";f.textContent=["❄","❅","❆"][Math.floor(Math.random()*3)];
 f.style.left=Math.random()*100+"vw";
 f.style.fontSize=(10+Math.random()*16)+"px";
 const d=5+Math.random()*6;f.style.animationDuration=d+"s";
 document.body.appendChild(f);setTimeout(()=>f.remove(),d*1000);
}
setInterval(snow,350);
function saveGame(){
 localStorage.setItem("cookieClickerSave",JSON.stringify({cookies,totalCookies,clickPower,counts}));
}
function loadGame(){
 try{
  const d=JSON.parse(localStorage.getItem("cookieClickerSave"));
  if(!d)return;
  cookies=d.cookies||0;totalCookies=d.totalCookies||0;clickPower=d.clickPower||1;
  if(d.counts)Object.keys(counts).forEach(id=>counts[id]=d.counts[id]||0);
 }catch(e){}
}
$("saveBtn").addEventListener("click",()=>{saveGame();showToast("Game saved!")});
$("resetBtn").addEventListener("click",()=>{
 if(!confirm("Are you sure you want to reset your bakery?"))return;
 cookies=0;totalCookies=0;clickPower=1;
 Object.keys(counts).forEach(id=>counts[id]=0);
 localStorage.removeItem("cookieClickerSave");render();showToast("Bakery reset!");
});
$("soundBtn").addEventListener("click",()=>{
 sound=!sound;$("soundBtn").textContent=sound?"🔊 Sound: On":"🔊 Sound: Off";
});
loadGame();render();
setInterval(()=>{
 const gain=getCps()/10;cookies+=gain;totalCookies+=gain;render();
},100);
setInterval(saveGame,5000);
setInterval(()=>{
 if(Math.random()<.65&&$("goldenCookie").style.display!=="block")spawnGolden();
},35000);
</script>
</body>
</html>
